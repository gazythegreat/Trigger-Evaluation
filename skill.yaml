name: trigger_evaluation
title: Trigger Evaluation — whether an AI crash trigger has fired
description: >-
  The evaluation framework for Raymond's four AI crash triggers (financing
  flip; utilisation fall; revenue conversion failure; backlog cancellation),
  stated clean: only the trigger definitions Raymond set on 31 Oct 2026, the
  sub-indicators he directed (neoclouds, the equity-pressure warning layer,
  price per token read by cause), his evidence rule (an opinion or post alone
  never fires a trigger; corroborating financial or market evidence is
  required), his expected cascade (demand-led 2-1-3-4, financing-led
  1-2-3-4), and a neutral evaluation procedure (gather afresh from primary
  sources, test each trigger separately, verdict per trigger, then the
  cascade read). It deliberately contains no statuses, no company
  attributions, no baselines, no past classifications and no other agent's
  conclusions, so every importing agent approaches the question afresh.
category: knowledge
